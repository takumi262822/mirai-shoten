<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来商店 | アロマキャンドル</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.3);
        }

        /* --- 幻想的なオーロラ背景 --- */
        body { 
            font-family: 'Montserrat', sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            background-attachment: fixed;
            color: #fff; line-height: 1.8;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- メインコンテナ --- */
        .product-container {
            width: 90%; max-width: 1000px;
            background: var(--glass); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 60px;
            display: flex; padding: 60px; gap: 60px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.15);
            animation: slideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ビジュアルエリア --- */
        .product-visual {
            flex: 1.2; background: rgba(255,255,255,0.1); border-radius: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10em; min-height: 450px; border: 1px solid var(--border);
            transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .product-visual:hover { transform: scale(1.03) rotate(-3deg); background: rgba(255,255,255,0.2); }

        /* --- 詳細エリア --- */
        .product-details { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .brand-label { font-size: 0.7em; letter-spacing: 5px; opacity: 0.6; text-transform: uppercase; margin-bottom: 10px; }
        h1 { font-family: 'Noto Serif JP', serif; font-size: 2.8em; margin: 0; font-weight: 900; line-height: 1.2; }
        .price-tag { font-size: 1.8em; font-weight: 200; margin: 20px 0; letter-spacing: 2px; }
        .description { font-size: 0.95em; opacity: 0.8; margin-bottom: 40px; }

        /* --- 操作エリア --- */
        .controls { display: flex; gap: 20px; align-items: center; margin-bottom: 30px; }
        .qty-wrapper { background: rgba(255,255,255,0.1); border: 1px solid var(--border); border-radius: 20px; padding: 10px 20px; }
        select { background: transparent; border: none; color: #fff; font-size: 1.1em; outline: none; cursor: pointer; font-family: 'Montserrat'; }
        option { background: #333; color: #fff; }

        .btn-cart {
            flex: 1; background: #fff; color: #000; border: none; padding: 20px;
            border-radius: 20px; font-weight: 600; letter-spacing: 2px;
            cursor: pointer; transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .btn-cart:hover { background: #000; color: #fff; transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }

        .btn-back {
            text-align: center; text-decoration: none; color: #fff; font-size: 0.7em;
            letter-spacing: 3px; opacity: 0.5; transition: 0.3s; text-transform: uppercase;
            margin-top: 10px; display: block;
        }
        .btn-back:hover { opacity: 1; letter-spacing: 5px; }

        @media (max-width: 900px) {
            .product-container { flex-direction: column; padding: 40px 30px; margin: 40px 0; }
            .product-visual { min-height: 300px; font-size: 7em; }
        }
        footer { text-align: center; padding: 30px; color: rgba(255,255,255,0.3); font-size: 0.6em; letter-spacing: 4px; }
    </style>
</head>
<body>

    <div class="product-container">
        <div class="product-visual">🕯️</div>

        <div class="product-details">
            <div class="brand-label">Mirai Collection</div>
            <h1>アロマキャンドル</h1>
            <div class="price-tag">¥2,400</div>
            
            <p class="description">
                天然由来のワックスを使用した心安らぐ香り。
                おやすみ前のリラックスタイムに灯せば、
                ゆらめく火影と共に、穏やかで上質な時間が流れます。
            </p>

            <div class="controls">
                <div class="qty-wrapper">
                    <span style="font-size:0.7em; opacity:0.5; margin-right:10px;">数量</span>
                    <select id="quantity">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
                <button class="btn-cart">カートに追加</button>
            </div>

            <a href="index.html" class="btn-back">← ギャラリーへ戻る</a>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
    <footer>&copy; <span data-current-year>2026</span> MIRAI SHOTEN. All Rights Reserved.</footer>
</body>
</html>
