<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout / 未来商店</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root { 
            --bg: #fdfdfd; 
            --panel: rgba(255, 255, 255, 0.4);
            --text: #2d3436; 
            --accent: #2d3436;
            --error: #ff7675;
            --aurora-1: rgba(255, 173, 173, 0.3);
            --aurora-2: rgba(160, 196, 255, 0.3);
            --aurora-3: rgba(253, 255, 182, 0.3);
        }
        
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            margin: 0; padding: 0; min-height: 100vh; color: var(--text);
        }

        /* --- 幻想的オーロラ・ヘッダー --- */
        header { 
            padding: 25px 60px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }

        header::before, header::after {
            content: ""; position: absolute; width: 300px; height: 300px;
            border-radius: 50%; filter: blur(60px); z-index: -1;
            animation: aurora-move 15s infinite alternate;
        }
        header::before { background: var(--aurora-1); top: -150px; left: -50px; }
        header::after { background: var(--aurora-2); bottom: -150px; right: -50px; animation-delay: -5s; }

        @keyframes aurora-move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.5); }
        }

        .logo-container { display: flex; flex-direction: column; text-decoration: none; }
        .logo-main { 
            font-family: 'Noto Serif JP', serif; font-size: 1.8em; font-weight: 900; 
            color: #1a1a1a; letter-spacing: -1px; position: relative;
        }
        .logo-dot { 
            color: var(--error); 
            text-shadow: 0 0 10px var(--error), 0 0 20px var(--error);
            animation: pulse 3s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; filter: brightness(1); } 50% { opacity: 0.6; filter: brightness(1.5); } }
        
        .logo-sub {
            font-family: 'Inter', sans-serif; font-size: 0.6em; font-weight: 700;
            letter-spacing: 5px; color: #7f8c8d; margin-top: 5px;
            text-transform: uppercase; opacity: 0.8;
        }

        .checkout-container { 
            display: flex; gap: 50px; width: 92%; max-width: 1200px; 
            margin: 80px auto; align-items: flex-start;
        }

        .form-section { 
            flex: 1.6; background: var(--panel); 
            padding: 60px; border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px rgba(0,0,0,0.03), inset 0 0 20px rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
        }
        
        h2 { 
            font-size: 0.9em; letter-spacing: 5px; font-weight: 700;
            margin-bottom: 45px; color: #1a1a1a;
            display: flex; align-items: center;
        }
        h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, #ccc, transparent); margin-left: 20px; }

        .form-group { margin-bottom: 35px; }
        label { display: block; font-size: 0.7em; font-weight: 900; letter-spacing: 2px; margin-bottom: 12px; color: #555; }
        
        input { 
            width: 100%; padding: 18px; border: 1px solid rgba(255,255,255,0.8); 
            background: rgba(255,255,255,0.5); border-radius: 18px;
            font-family: inherit; font-size: 1.05em; outline: none; transition: 0.4s;
            box-sizing: border-box; color: #1a1a1a;
        }
        input:focus { 
            background: #fff; border-color: #fff;
            box-shadow: 0 10px 30px rgba(160, 196, 255, 0.2);
            transform: translateY(-2px);
        }

        .radio-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .radio-item { 
            background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.8);
            padding: 22px; text-align: center; border-radius: 20px;
            cursor: pointer; font-size: 0.85em; font-weight: 700; transition: 0.3s;
        }
        .radio-item.selected { 
            background: var(--accent); color: #fff; border-color: var(--accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); transform: translateY(-5px);
        }
        .radio-item input { display: none; }

        .summary-section { 
            flex: 1; background: var(--accent); color: #fff; padding: 50px; 
            position: sticky; top: 140px; border-radius: 40px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.2);
            background-image: radial-gradient(at 0% 0%, rgba(255,255,255,0.1) 0px, transparent 50%);
        }
        .summary-item { 
            display: flex; justify-content: space-between; font-size: 0.9em; 
            margin-bottom: 22px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
            letter-spacing: 1px;
        }
        .total-row { margin-top: 40px; display: flex; justify-content: space-between; font-size: 2.2em; font-weight: 900; }

        .btn-order { 
            width: 100%; background: #fff; color: var(--accent); border: none; 
            padding: 26px; font-weight: 900; font-size: 1.2em; letter-spacing: 6px;
            border-radius: 20px; cursor: pointer; margin-top: 45px; transition: 0.5s;
        }
        .btn-order:hover { 
            transform: scale(1.03); 
            box-shadow: 0 0 40px rgba(255,255,255,0.4);
        }

        .btn-back { display: block; text-align: center; margin-top: 25px; color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.8em; font-weight: 700; letter-spacing: 2px; }
        .error-message { color: var(--error); font-size: 0.75em; font-weight: 700; margin-top: 10px; text-shadow: 0 0 5px rgba(255,118,115,0.2); }

        @media (max-width: 900px) { header { padding: 20px; } .checkout-container { flex-direction: column; } .summary-section { width: 100%; position: static; } }
        footer { text-align: center; padding: 30px; color: rgba(255,255,255,0.3); font-size: 0.6em; letter-spacing: 4px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-container">
            <span class="logo-main">未来商店<span class="logo-dot">.</span></span>
            <span class="logo-sub">Mirai Shoten</span>
        </a>
        <div style="font-size: 0.7em; font-weight: 900; letter-spacing: 5px; opacity: 0.3; text-transform: uppercase;">チェックアウト</div>
    </header>

    <div class="checkout-container">
        <div class="form-section">
            <h2>SHIPPING / お届け先</h2>
            <div class="form-group"><label>お名前</label><input type="text" id="name" placeholder="姓名（フルネーム）"><div id="nameError" class="error-message" style="display:none;">ご入力が必要です</div></div>
            <div class="form-group"><label>メールアドレス</label><input type="email" id="email" placeholder="mirai@example.jp"><div id="emailError" class="error-message" style="display:none;">メールアドレスをご確認ください</div></div>
            <div class="form-group"><label>郵便番号</label><input type="text" id="zip" placeholder="000-0000"><div id="zipError" class="error-message" style="display:none;">郵便番号の形式をご確認ください</div></div>
            <div class="form-group"><label>住所</label><input type="text" id="address" placeholder="都道府県 市区町村 番地 建物名"><div id="addressError" class="error-message" style="display:none;">お届け先をご入力ください</div></div>

            <h2 style="margin-top:70px;">PAYMENT / お支払い</h2>
            <div class="radio-group" id="paymentGroup">
                <label class="radio-item"><input type="radio" name="payment" value="カード決済"> カード決済</label>
                <label class="radio-item"><input type="radio" name="payment" value="コンビニ"> コンビニ</label>
                <label class="radio-item"><input type="radio" name="payment" value="銀行振込"> 銀行振込</label>
            </div>
            <div id="paymentError" class="error-message" style="display:none; text-align:center; margin-top:30px;">お支払い方法を選択してください</div>
        </div>

        <div class="summary-section">
            <h2 style="color: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.1);">注文確認</h2>
            <div id="summaryList"></div>
            <div class="total-row"><span>合計金額</span><span id="summaryTotal">¥0</span></div>
            <button class="btn-order">注文を確定する</button>
            <a href="index.html" class="btn-back">お買い物を続ける</a>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
    <footer>&copy; <span data-current-year>2026</span> MIRAI SHOTEN. All Rights Reserved.</footer>
</body>
</html>
