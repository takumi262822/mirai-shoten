<!-- * Contact form confirmation page * @author Takumi Harada * @date 2026/3/31 -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm | 未来商店</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.3);
            --text: #fff;
        }

        body { 
            font-family: 'Montserrat', "Hiragino Sans", sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            background-attachment: fixed;
            color: var(--text); line-height: 1.8; overflow-x: hidden;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1100px; height: 70px;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; background: var(--glass); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 100px;
        }

        .logo { 
            font-family: 'Montserrat', sans-serif; font-size: 1.1em; font-weight: 200;
            letter-spacing: 8px; color: #fff; text-decoration: none; text-transform: uppercase;
        }

        .container {
            width: 95%; max-width: 800px; 
            margin: 140px auto 60px; padding: 0 20px; flex: 1;
            box-sizing: border-box;
        }

        .confirm-box {
            background: var(--glass); backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            border: 1px solid var(--border); border-radius: 40px;
            padding: 50px 60px; 
            box-shadow: 0 40px 120px rgba(0,0,0,0.1);
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        h2 { 
            font-family: 'Noto Serif JP', serif; font-size: 1.8em; 
            text-align: center; margin-bottom: 40px; letter-spacing: 4px;
        }

        .item-row { 
            display: grid; grid-template-columns: 200px 1fr;
            margin-bottom: 15px; padding-bottom: 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.15); 
        }
        .label { font-size: 0.75em; font-weight: 600; letter-spacing: 2px; opacity: 0.7; }
        .value { font-size: 1em; word-break: break-all; }

        .item-block { margin-top: 30px; }
        .item-block .label { margin-bottom: 15px; }
        
        textarea { 
            width: 100%; height: 120px; padding: 20px; border-radius: 20px;
            border: 1px solid var(--border); background: rgba(255,255,255,0.05);
            color: #fff; font-family: inherit; font-size: 0.95em; outline: none;
            box-sizing: border-box; transition: 0.4s; resize: none;
        }
        textarea:focus { background: rgba(255,255,255,0.15); border-color: #fff; }

        .button-group { margin-top: 40px; display: flex; gap: 20px; }
        button { 
            flex: 1; padding: 20px; cursor: pointer; border: none; 
            border-radius: 100px; font-weight: bold; font-size: 0.9em; 
            letter-spacing: 3px; transition: 0.4s; font-family: 'Montserrat', sans-serif;
        }
        .btn-back { background: transparent; color: #fff; border: 1px solid var(--border); }
        .btn-back:hover { background: rgba(255,255,255,0.1); }
        .btn-submit { background: #fff; color: #333; }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        footer { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); font-size: 0.6em; letter-spacing: 4px; }

        @media (max-width: 600px) {
            .confirm-box { padding: 40px 20px; }
            .item-row { grid-template-columns: 1fr; gap: 5px; }
            .button-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Mirai</a>
    </header>

    <div class="container">
        <div class="confirm-box">
            <h2>お問い合わせ内容確認</h2>
            
            <div class="item-row">
                <span class="label">お名前</span>
                <span id="displayName" class="value"></span>
            </div>
            <div class="item-row">
                <span class="label">カナ</span>
                <span id="displayKana" class="value"></span>
            </div>
            <div class="item-row">
                <span class="label">電話番号</span>
                <span id="displayTel" class="value"></span>
            </div>
            <div class="item-row">
                <span class="label">メールアドレス</span>
                <span id="displayEmail" class="value"></span>
            </div>
            <div class="item-row">
                <span class="label">都道府県</span>
                <span id="displayPref" class="value"></span>
            </div>
            <div class="item-row">
                <span class="label">ご利用状況</span>
                <span id="displayUsage" class="value"></span>
            </div>
            <div class="item-row">
                <span class="label">お問い合わせ項目</span>
                <span id="displayCategory" class="value"></span>
            </div>

            <div class="item-block">
                <span class="label">メッセージ本文（任意）</span>
                <textarea id="displayMessage" placeholder="補足事項があれば入力してください"></textarea>
            </div>

            <div class="button-group">
                <button type="button" class="btn-back" data-action="go-back">戻る</button>
                <button type="button" class="btn-submit js-nav" data-href="contact-complete.html">送信する</button>
            </div>
        </div>
    </div>

    <footer>&copy; <span data-current-year>2026</span> MIRAI SHOTEN. All Rights Reserved.</footer>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
