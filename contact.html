<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | 未来商店</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.3);
            --text: #fff;
            --error-red: #ff4d4d;
        }

        body { 
            font-family: 'Montserrat', "Hiragino Sans", sans-serif;
            margin: 0; padding: 0;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            background-attachment: fixed;
            color: var(--text); line-height: 1.8; overflow-x: hidden;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1100px; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; box-sizing: border-box; z-index: 1000;
            background: var(--glass); backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 100px;
        }

        .logo { 
            font-family: 'Montserrat', sans-serif; font-size: 1.1em; font-weight: 200;
            letter-spacing: 8px; color: #fff; text-decoration: none; text-transform: uppercase;
        }

        .container {
            width: 95%; max-width: 1000px; 
            margin: 160px auto 60px; padding: 0 20px; flex: 1;
            box-sizing: border-box;
        }

        .contact-box {
            background: var(--glass); backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            border: 1px solid var(--border); border-radius: 60px;
            padding: 60px 80px; 
            box-shadow: 0 40px 120px rgba(0,0,0,0.1);
            animation: slideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            font-family: 'Noto Serif JP', serif; font-size: 2.5em; 
            text-align: center; margin-bottom: 40px; letter-spacing: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
        }

        .form-group { margin-bottom: 25px; position: relative; }
        .full-width { grid-column: span 2; }

        label { display: block; font-size: 0.7em; font-weight: 600; letter-spacing: 3px; margin-bottom: 8px; opacity: 0.8; }
        
        input {
            width: 100%; padding: 18px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05);
            color: #fff; font-family: inherit; font-size: 1em; outline: none;
            box-sizing: border-box; transition: 0.4s;
        }

        input:focus { background: rgba(255,255,255,0.15); border-color: #fff; }

        input.is-error {
            border-color: var(--error-red) !important;
            background: rgba(255, 77, 77, 0.1) !important;
        }

        .error-message { 
            color: var(--error-red); font-size: 0.75em; font-weight: bold; 
            margin-top: 8px; display: none; letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        .radio-container { display: flex; gap: 25px; margin-top: 10px; flex-wrap: wrap; }
        .radio-item { display: flex; align-items: center; cursor: pointer; font-size: 0.9em; }
        .radio-item input { width: auto; margin-right: 10px; transform: scale(1.3); cursor: pointer; }

        .btn-send {
            width: 100%; max-width: 420px;
            display: block; margin: 50px auto 0;
            padding: 22px; border-radius: 100px; border: none;
            background: #fff; color: #333; font-weight: 700; letter-spacing: 6px;
            cursor: pointer; transition: 0.5s; font-family: 'Montserrat', sans-serif;
        }

        .btn-send:hover {
            transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            letter-spacing: 10px;
        }

        .btn-back {
            display: block; text-align: center; margin-top: 30px;
            text-decoration: none; color: #fff; font-size: 0.7em;
            letter-spacing: 4px; opacity: 0.5;
        }

        footer { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); font-size: 0.6em; letter-spacing: 4px; }

        @media (max-width: 850px) {
            .contact-box { padding: 40px 20px; border-radius: 40px; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Mirai</a>
        <div style="font-size: 0.7em; letter-spacing: 4px; font-weight: 600; opacity: 0.6;">INQUIRY</div>
    </header>

    <div class="container">
        <div class="contact-box">
            <h2>Contact</h2>
            <form id="contactForm" action="contact-confirm.html" method="GET" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label>お名前（必須）</label>
                        <input type="text" id="name" name="name" placeholder="例：山田太郎" autocomplete="name">
                        <div id="nameError" class="error-message">！ お名前を入力してください（記号不可）</div>
                        <div id="nameNumberError" class="error-message">！ 数字は入力できません</div>
                    </div>

                    <div class="form-group">
                        <label>カナ（必須）</label>
                        <input type="text" id="kana" name="kana" placeholder="例：ヤマダタロウ" autocomplete="honorific-prefix">
                        <div id="kanaError" class="error-message">！ カタカナ（全角）のみで入力してください</div>
                    </div>

                    <div class="form-group">
                        <label>電話番号（必須）</label>
                        <input type="tel" id="tel" name="tel" placeholder="例：09012345678" autocomplete="tel">
                        <div id="telError" class="error-message">！ 正しい電話番号を入力してください（10桁以上）</div>
                    </div>

                    <div class="form-group">
                        <label>メールアドレス（必須）</label>
                        <input type="email" id="email" name="email" placeholder="例：example@mail.com" autocomplete="email">
                        <div id="emailError" class="error-message">！ メールアドレスの形式が正しくありません</div>
                    </div>

                    <div class="form-group">
                        <label>都道府県（必須）</label>
                        <input type="text" id="pref" name="pref" placeholder="例：東京都" autocomplete="address-level1">
                        <div id="prefError" class="error-message">！ 都道府県を入力してください（記号不可）</div>
                    </div>

                    <div class="form-group">
                        <label>ご利用について（必須）</label>
                        <div class="radio-container">
                            <label class="radio-item"><input type="radio" name="usage" value="はじめて">はじめて</label>
                            <label class="radio-item"><input type="radio" name="usage" value="二回目以上">二回目以上</label>
                        </div>
                        <div id="usageError" class="error-message">！ どちらか選択してください</div>
                    </div>
                </div>

                <div class="form-group full-width" style="margin-top: 10px;">
                    <label>お問い合わせ項目（必須）</label>
                    <div class="radio-container">
                        <label class="radio-item"><input type="radio" name="category" value="注文">注文・配送・お支払いについて</label>
                        <label class="radio-item"><input type="radio" name="category" value="商品">商品について</label>
                        <label class="radio-item"><input type="radio" name="category" value="返品">返品・交換について</label>
                        <label class="radio-item"><input type="radio" name="category" value="その他">その他</label>
                    </div>
                    <div id="categoryError" class="error-message">！ 項目を選択してください</div>
                </div>

                <button type="submit" class="btn-send">SEND MESSAGE</button>
                <a href="index.html" class="btn-back">BACK TO HOME</a>
            </form>
        </div>
    </div>

    <footer>&copy; 2026 MIRAI SHOTEN. All Rights Reserved.</footer>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
